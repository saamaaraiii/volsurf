[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volsurf"
version = "0.1.0"
description = "Option pricing (Black-Scholes, binomial, Monte Carlo, Heston), arbitrage-checked SVI volatility surfaces and Heston calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
plots = ["matplotlib>=3.7", "tabulate>=0.9"]
app = ["streamlit>=1.30", "plotly>=5.18", "yfinance>=0.2"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "tabulate>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/volsurf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
